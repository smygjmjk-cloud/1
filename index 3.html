(() => {
'use strict';
const desktop=document.getElementById('desktop');
const tabs=document.getElementById('taskTabs');
const $=id=>document.getElementById(id);
const KEY='gyuldows98_v1';
const DEFAULT={found:[],wallpaper:'teal',sound:true,wishes:0};
let state;
try{state={...DEFAULT,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...DEFAULT}}
if(!Array.isArray(state.found))state.found=[];
state.found=state.found.filter(v=>Number.isInteger(v)&&v>=1&&v<=7);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
let z=10;
let audio;
function sound(freq=660){if(!state.sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();const osc=audio.createOscillator(),gain=audio.createGain();osc.type='square';osc.frequency.value=freq;gain.gain.setValueAtTime(.04,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.13)}catch{}}
const fruits=[null,'바탕화면의 수상한 귤','귤 탐색기 깊은 폴더','귤 인터넷 광고','휴지통 속 멀쩡한 귤','그림판 아래의 귤','내 컴퓨터의 숨겨진 저장소','제어판의 진단용 귤'];
let popupAfter=null;
function alertBox(message,title='시스템 알림',emoji='🍊',after=null){$('popupText').textContent=message;$('popupTitle').textContent=title;$('popupEmoji').textContent=emoji;popupAfter=after;$('popupShade').classList.add('show');$('popupOk').focus()}
function closePopup(){$('popupShade').classList.remove('show');const callback=popupAfter;popupAfter=null;if(callback)callback()}
$('popupOk').onclick=e=>{e.stopPropagation();closePopup()};$('popupX').onclick=e=>{e.stopPropagation();closePopup()};
function harvestAnimation(x,y){const layer=$('harvestLayer');const main=document.createElement('span');main.className='harvest-burst';main.textContent='🍊';main.style.left=x+'px';main.style.top=y+'px';layer.appendChild(main);setTimeout(()=>main.remove(),1100);for(let i=0;i<12;i++){const sp=document.createElement('span');sp.className='harvest-spark';sp.textContent=i%3===0?'✦':'✧';sp.style.left=x+'px';sp.style.top=y+'px';const a=i*Math.PI/6;sp.style.setProperty('--dx',Math.round(Math.cos(a)*110)+'px');sp.style.setProperty('--dy',Math.round(Math.sin(a)*110)+'px');layer.appendChild(sp);setTimeout(()=>sp.remove(),1000)}}
function collect(n,x=innerWidth/2,y=innerHeight/2){if(state.found.includes(n)){alertBox('이 귤은 이미 주머니에 있습니다. 중복 수집은 안 됩니다.','중복 획득','🧺');return}state.found.push(n);state.found.sort((a,b)=>a-b);save();sound(880);update();harvestAnimation(x,y);alertBox(`설탕 코팅된 귤 ${n}번을 획득했습니다! (${state.found.length}/7)`,'아이템 획득!','🍊',state.found.length===7?()=>{sound(1100);alertBox('일곱 개가 모두 모였습니다! 소원 메모장에서 소원을 실행할 수 있습니다.','수집 완료','✨');openWindow('notepad')}:null)}
function fruit(n,label='🍊 수상한 귤을 줍는다'){return `<div class="item-orange ${state.found.includes(n)?'collected':''}"><span class="fruit">🍊</span><div><b>설탕 코팅된 귤 #${n}</b><small>${state.found.includes(n)?'이미 획득한 귤입니다':fruits[n]}</small></div><button class="win-btn" data-collect="${n}">${state.found.includes(n)?'확인':'줍기'}</button></div>`}
const windows={};
function windowMarkup(id,title,icon){const el=document.createElement('section');el.className='window';el.id='win-'+id;el.setAttribute('role','dialog');el.setAttribute('aria-label',title);el.style.left=(105+(Object.keys(windows).length%5)*24)+'px';el.style.top=(65+(Object.keys(windows).length%5)*22)+'px';el.innerHTML=`<div class="titlebar"><span>${icon}</span><span class="title">${title}</span><div class="window-actions"><button type="button" class="x-btn max-btn" data-max="${id}" aria-label="${title} 최대화">□</button><button type="button" class="x-btn" data-close="${id}" aria-label="${title} 닫기">×</button></div></div><div class="window-body"></div><div class="statusbar">GYULdows 98 · 준비 완료</div>`;desktop.appendChild(el);windows[id]={el,title,icon};enableDrag(el);
// Direct controls: click is handled on the button, not indirectly via desktop.
el.querySelector('[data-close]').addEventListener('click', e=>{e.preventDefault();e.stopPropagation();closeWindow(id)});
el.querySelector('[data-max]').addEventListener('click', e=>{e.preventDefault();e.stopPropagation();toggleMax(id)});
return el}

case 'explorer':{

if(folder==='sugar')html+=`<button class="win-btn" data-folder="root">← 뒤로</button><div class="panel">sugar_recipe.txt<br>설탕 100g, 물 50ml, 기적 한 스푼.</div>`;
if(folder==='hidden')html+=`<button class="win-btn" data-folder="root">← 뒤로</button><div class="note">⚠️ 관리자 권한이 필요합니다.<br>하지만 관리자는 귤을 먹으러 갔습니다.</div>${fruit(2)}`;
break}
case 'browser':{
html=`<h2 class="win-heading">🌐 GYUL Explorer 5.0</h2><div class="address">주소: http://www.gyul.wish/${webPage}</div><div class="fake-browser">`;
if(webPage==='home')html+=`<h3>🍊 귤 인터넷 포털</h3><p>환영합니다! 전 세계 7개의 귤을 검색합니다.</p><div class="browser-links"><button data-web="shop">🍊 설탕귤 쇼핑몰 [광고]</button><button data-web="news">📰 오늘의 귤 뉴스</button><button data-web="forum">💬 귤 게시판</button></div>`;
if(webPage==='shop')html+=`<button class="win-btn" data-web="home">← 홈</button><h3>★ 긴급 귤 특가 ★</h3><p>단 0원! 택배비는 소원 하나!</p>${fruit(3)}`;
if(webPage==='news')html+=`<button class="win-btn" data-web="home">← 홈</button><h3>속보: 설탕 코팅된 귤 품귀</h3><p>전문가들은 실종된 귤을 찾는 누군가가 있다고 설명했습니다.</p>`;
if(webPage==='forum')html+=`<button class="win-btn" data-web="home">← 홈</button><h3>익명 귤 게시판</h3><p>ㅇㅇ: 귤 7개 모으면 진짜 소원 들어줌?</p><p>귤관리자: 이용약관을 확인해 주세요.</p>`;
html+='</div>';break}
case 'notepad':html=`<h2 class="win-heading">📝 소원.txt</h2><div class="note">설탕 코팅된 귤 일곱 개를 제출하면<br>소원 한 개를 실행할 수 있습니다.<br><br>현재 확보: <b>${state.found.length}/7</b></div><div class="sep"></div><label for="wishText"><b>소원 내용을 작성하세요.</b></label><textarea class="wish-input" id="wishText" placeholder="여기에 소원을 적으세요..." ${state.found.length!==7?'disabled':''}></textarea><div class="row" style="margin-top:10px"><button class="win-btn" id="runWish" ${state.found.length!==7?'disabled':''}>✨ 소원 실행.exe</button><span class="tiny-muted">${state.found.length===7?'실행 권한이 승인되었습니다.':'귤 7개를 모두 모으면 활성화됩니다.'}</span></div>`;break;
case 'recycle':html=`<h2 class="win-heading">🗑️ 귤 휴지통</h2><p>휴지통에 있는 파일:</p><div class="panel">🍊 귤껍질.tmp<br>🍊 귤껍질(1).tmp<br>📄 어제의 소원.doc</div><p>이상하게도 아직 멀쩡한 귤 하나가 보입니다.</p>${fruit(4)}`;break;
case 'paint':html=`<h2 class="win-heading">🎨 귤 그림판</h2><div style="background:white;border:3px inset #ddd;height:185px;display:grid;place-items:center;position:relative"><div style="font-size:95px">🍊</div><span style="position:absolute;bottom:6px;right:8px;font-size:11px">무제 - 그림판</span></div><p>작품명: 귤의 초상 (1998)</p>${fruit(5)}`;break;
case 'control':html=`<h2 class="win-heading">⚙️ 제어판</h2><div class="panel"><b>바탕화면 설정</b><div class="row" style="margin-top:9px"><button class="win-btn" data-theme="teal">청록</button><button class="win-btn" data-theme="blue">파랑</button><button class="win-btn" data-theme="pink">분홍</button><button class="win-btn" data-theme="night">야간</button></div></div><div class="panel"><label><input type="checkbox" id="soundToggle" ${state.sound?'checked':''}> 효과음 켜기</label></div><p>시스템 진단 도중 귤이 발견되었습니다.</p>${fruit(7)}<div class="sep"></div><button class="win-btn" id="resetBtn">🧹 수집 기록 초기화</button><p class="tiny-muted">초기화하면 모은 귤과 소원 실행 횟수가 삭제됩니다.</p>`;break;
case 'collection':html=`<h2 class="win-heading">🍊 귤 수집 현황</h2><b>${state.found.length} / 7 수집 완료</b><div class="progress-bar"><div class="progress-fill" style="width:${state.found.length/7*100}%"></div></div><div class="panel">${Array.from({length:7},(_,i)=>`<div style="padding:6px;border-bottom:1px dotted #ddd">${state.found.includes(i+1)?'🍊':'❔'} 귤 #${i+1} · ${state.found.includes(i+1)?fruits[i+1]:'미발견'}</div>`).join('')}</div><p>🔎 단서: 바탕화면, 탐색기, 인터넷, 휴지통, 그림판, 내 컴퓨터, 제어판.</p><button class="win-btn" data-open="notepad">📝 소원 메모장으로 이동</button>`;break;
case 'secret':html=state.found.length===7?`<div class="secret-locked">🍊 ACCESS GRANTED 🍊</div><div class="note" style="text-align:center">축하합니다.<br>당신은 일곱 개의 귤을 찾아냈습니다.<br><br>그런데 잠깐.<br><b>소원을 들어주는 건 대체 누구일까요?</b></div><button class="win-btn" data-open="notepad">소원을 실행한다</button>`:`<div class="secret-locked">🔒 ACCESS DENIED</div><div class="note">접근이 거부되었습니다.<br>필요한 귤: 7개<br>현재 보유: ${state.found.length}개</div>`;break;

body.innerHTML=html;
if(id==='notepad'){$('runWish')?.addEventListener('click',runWish)}
if(id==='control'){$('soundToggle')?.addEventListener('change',e=>{state.sound=e.target.checked;save()});$('resetBtn')?.addEventListener('click',()=>{if(confirm('정말 수집 기록을 초기화할까요?')){state.found=[];state.wishes=0;save();update();alertBox('귤 저장소가 비워졌습니다. 다시 모을 수 있습니다.','초기화 완료','🧹')}})}
}
function runWish(){if(state.found.length!==7)return;const wish=$('wishText')?.value.trim()||'';if(!wish){alertBox('소원을 입력해 주세요. 귤신은 독심술을 지원하지 않습니다.','입력 오류','⚠️');return}state.wishes++;save();sound(1000);showFinale(wish)}
const endings=[['소원 접수 완료','귤신이 소원을 접수했습니다. 예상 처리 시간은 귤이 익을 때까지입니다.'],['오류 777','소원이 지나치게 인간적입니다. 그래도 귤신은 조금 감동했습니다.'],['승인되었습니다','단, 실행 담당자가 귤을 모두 먹고 조기 퇴근했습니다.'],['우주 저장 완료','당신의 소원은 7번 별의 설탕 창고에 안전하게 보관되었습니다.']];
let finaleTimers=[];
function clearFinaleTimers(){finaleTimers.forEach(clearTimeout);finaleTimers=[]}
function showFinale(wish){clearFinaleTimers();const f=$('finale');f.classList.add('show');f.classList.remove('finished');f.setAttribute('aria-hidden','false');$('finaleTitle').textContent='소원 전송 중...';$('finaleWish').textContent='“'+wish+'”';$('finaleResult').textContent='설탕 입자 7개를 재정렬하는 중...';$('finaleStar').textContent='✦';const choice=endings[Math.floor(Math.random()*endings.length)];finaleTimers.push(setTimeout(()=>{$('finaleTitle').textContent='귤신 호출 중...';$('finaleResult').textContent='응답 수신 대기 중 ···';sound(570)},1000));finaleTimers.push(setTimeout(()=>{$('finaleTitle').textContent=choice[0];$('finaleResult').textContent=choice[1];$('finaleStar').textContent='🍊';f.classList.add('finished');sound(900);$('finaleClose').focus()},2400))}
$('finaleClose').addEventListener('click',()=>{clearFinaleTimers();$('finale').classList.remove('show','finished');$('finale').setAttribute('aria-hidden','true');openWindow('secret')});
function toggleMax(id){const w=windows[id];if(!w)return;w.el.classList.toggle('maximized');const on=w.el.classList.contains('maximized');w.el.querySelector('[data-max]').textContent=on?'❐':'□';w.el.querySelector('[data-max]').setAttribute('aria-label',w.title+(on?' 복원':' 최대화'));bringFront(id);sound(470)}
function openWindow(id){const w=windows[id];if(!w)return;w.el.classList.add('open');render(id);bringFront(id);refreshTabs();closeStart()}
function closeWindow(id){const w=windows[id];if(!w)return;w.el.classList.remove('open');w.el.classList.remove('maximized');w.el.querySelector('[data-max]').textContent='□';refreshTabs();sound(320)}
function bringFront(id){z++;Object.entries(windows).forEach(([key,w])=>w.el.querySelector('.titlebar').classList.toggle('inactive',key!==id));windows[id].el.style.zIndex=z;refreshTabs()}
function refreshTabs(){tabs.innerHTML=Object.entries(windows).filter(([id,w])=>w.el.classList.contains('open')).map(([id,w])=>`<button class="task-btn ${Number(w.el.style.zIndex)===z?'active':''}" data-task="${id}">${w.icon} ${w.title}</button>`).join('')}
function update(){desktop.dataset.wallpaper=state.wallpaper;$('taskCount').textContent=`🍊 ${state.found.length}/7`;$('desktopOrange').style.display=state.found.includes(1)?'none':'block';Object.keys(windows).forEach(id=>{if(windows[id].el.classList.contains('open')){if(id==='notepad'){const old=$('wishText')?.value;render(id);if(old&&$('wishText'))$('wishText').value=old}else render(id)}})}
function enableDrag(el){const bar=el.querySelector('.titlebar');let dragging=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||el.classList.contains('maximized')||matchMedia('(max-width:620px)').matches)return;const r=el.getBoundingClientRect();dragging={pointer:e.pointerId,x:e.clientX-r.left,y:e.clientY-r.top};bar.setPointerCapture(e.pointerId);const id=el.id.slice(4);bringFront(id)});bar.addEventListener('pointermove',e=>{if(!dragging||dragging.pointer!==e.pointerId)return;const x=Math.max(0,Math.min(window.innerWidth-100,e.clientX-dragging.x));const y=Math.max(0,Math.min(window.innerHeight-100,e.clientY-dragging.y));el.style.left=x+'px';el.style.top=y+'px'});const stop=()=>{dragging=null};bar.addEventListener('pointerup',stop);bar.addEventListener('pointercancel',stop);el.addEventListener('pointerdown',()=>{bringFront(el.id.slice(4))})}
function closeStart(){$('startMenu').classList.remove('show');$('startBtn').setAttribute('aria-expanded','false')}
$('startBtn').addEventListener('click',()=>{const show=$('startMenu').classList.toggle('show');$('startBtn').setAttribute('aria-expanded',String(show));sound(440)});
desktop.addEventListener('click',e=>{const collectBtn=e.target.closest('[data-collect]');if(collectBtn){collect(Number(collectBtn.dataset.collect),e.clientX,e.clientY);return}const close=e.target.closest('[data-close]');if(close){closeWindow(close.dataset.close);return}const max=e.target.closest('[data-max]');if(max){toggleMax(max.dataset.max);return}const open=e.target.closest('[data-open]');if(open){openWindow(open.dataset.open);sound(550);return}const folderBtn=e.target.closest('[data-folder]');if(folderBtn){folder=folderBtn.dataset.folder;render('explorer');sound(510);return}const link=e.target.closest('[data-web]');if(link){webPage=link.dataset.web;render('browser');sound(480);return}const theme=e.target.closest('[data-theme]');if(theme){state.wallpaper=theme.dataset.theme;save();update();sound(590);return}const task=e.target.closest('[data-task]');if(task){openWindow(task.dataset.task);return}if(!e.target.closest('#startMenu')&&!e.target.closest('#startBtn'))closeStart()});
$('desktopOrange').onclick=e=>{e.stopPropagation();collect(1,e.clientX,e.clientY)};
$('helpBtn').onclick=()=>{closeStart();alertBox('아이콘을 열어서 설탕 코팅된 귤 7개를 찾으세요. 모두 모으면 소원 메모장의 실행 버튼이 열립니다. 수집 기록은 이 브라우저에 저장됩니다.','사용 설명서','💡')};
$('shutdown').onclick=()=>{closeStart();alertBox('시스템을 종료하려 했지만 귤이 전원 버튼을 먹었습니다.','종료 실패','🔌')};
function setClock(){$('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}setClock();setInterval(setClock,30000);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('popupShade').classList.contains('show'))closePopup();else if($('finale').classList.contains('show')&&$('finale').classList.contains('finished'))$('finaleClose').click();else {const active=Object.entries(windows).filter(([,w])=>w.el.classList.contains('open')).sort((a,b)=>Number(b[1].el.style.zIndex)-Number(a[1].el.style.zIndex))[0];if(active)closeWindow(active[0]);else closeStart()}}});
update();
let bootEnded=false,bootTimers=[];
function finishBoot(){if(bootEnded)return;bootEnded=true;bootTimers.forEach(clearTimeout);$('bootFill').style.width='100%';$('bootLine').textContent='GYULdows 98 준비 완료';$('bootScreen').classList.add('hidden');setTimeout(()=>$('bootScreen').remove(),650)}
$('skipBoot').addEventListener('click',finishBoot);
let progress=0;
const bootTimer=setInterval(()=>{if(bootEnded){clearInterval(bootTimer);return}progress=Math.min(100,progress+14+Math.floor(Math.random()*12));$('bootFill').style.width=progress+'%';$('bootLine').textContent=progress<60?'C:\\GYUL\\SYSTEM 로딩 중...':progress<100?'귤 드라이브 연결 중...':'시스템 준비 완료';if(progress===100){clearInterval(bootTimer);bootTimers.push(setTimeout(finishBoot,500))}},250);
bootTimers.push(bootTimer);

})();
