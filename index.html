<style>
:root{--desktop:#008080;--face:#c0c0c0;--light:#fff;--shadow:#808080;--dark:#404040;--navy:#000080;--ink:#121212;--orange:#ff9d17;--task:44px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Malgun Gothic","Apple SD Gothic Neo",Tahoma,sans-serif;font-size:13px;color:var(--ink);user-select:none;-webkit-tap-highlight-color:transparent}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,.icon:focus-visible{outline:2px dotted #111;outline-offset:2px}.desktop{position:relative;width:100%;height:100dvh;background:var(--desktop);overflow:hidden;background-image:radial-gradient(#ffffff0e 1px,transparent 1px);background-size:6px 6px}.desktop[data-wallpaper="blue"]{--desktop:#244a89}.desktop[data-wallpaper="pink"]{--desktop:#a56d8c}.desktop[data-wallpaper="night"]{--desktop:#263444}.desktop-icons{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,90px);grid-auto-columns:92px;gap:9px 8px;position:absolute;left:12px;top:12px;z-index:1}.icon{height:88px;width:88px;color:white;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:6px;padding:7px 3px;text-align:center;text-shadow:1px 1px #000;font-size:12px}.icon:hover,.icon:focus-visible{background:#00008055;border:1px dotted #fff}.icon .art{font-size:38px;line-height:42px;filter:drop-shadow(2px 2px 0 #2226)}.sticker{position:absolute;right:clamp(18px,8vw,110px);top:clamp(55px,16vh,160px);width:290px;max-width:44vw;color:#fff;text-align:center;pointer-events:none;text-shadow:3px 3px #004b4b66;transform:rotate(-5deg)}.sticker .big{font-size:clamp(40px,7vw,74px);font-weight:900;letter-spacing:-4px;line-height:1.05}.sticker .small{font-size:12px;letter-spacing:2px;font-weight:bold}.sticker .fruit{font-size:clamp(45px,7vw,80px);margin:16px 0}.sticker .hint{line-height:1.7;font-weight:bold;font-size:13px}.taskbar{position:absolute;bottom:0;left:0;right:0;height:calc(var(--task) + env(safe-area-inset-bottom));padding:4px 6px calc(4px + env(safe-area-inset-bottom));background:var(--face);display:flex;align-items:center;gap:5px;border-top:2px solid white;z-index:1000;box-shadow:0 -1px #666}.win-btn,.start-btn,.task-btn,.tool-btn,.tiny-btn{background:var(--face);color:#111;border:2px solid;border-color:var(--light) var(--dark) var(--dark) var(--light);border-radius:0;min-height:29px;padding:3px 9px}.win-btn:active,.start-btn:active,.task-btn:active,.tool-btn:active,.tiny-btn:active,.pressed{border-color:var(--dark) var(--light) var(--light) var(--dark)!important}.start-btn{font-weight:bold;white-space:nowrap}.task-tabs{flex:1;display:flex;min-width:0;gap:4px;overflow-x:auto;scrollbar-width:none}.task-tabs::-webkit-scrollbar{display:none}.task-btn{min-width:90px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}.task-btn.active{background:#aaa;border-color:var(--dark) var(--light) var(--light) var(--dark)}.tray{background:#b3b3b3;border:2px inset #eee;padding:5px 8px;display:flex;gap:12px;white-space:nowrap;align-items:center;font-size:12px}.orange-count{font-weight:bold;color:#8c3b00}.start-menu{position:absolute;bottom:calc(var(--task) + env(safe-area-inset-bottom));left:4px;width:240px;background:var(--face);z-index:1100;border:2px solid;border-color:white #444 #444 white;box-shadow:2px 2px #111;display:none;padding:3px}.start-menu.show{display:flex}.start-side{writing-mode:vertical-rl;transform:rotate(180deg);background:var(--navy);color:white;font-size:20px;font-weight:900;padding:10px 6px}.start-items{flex:1}.menu-option{width:100%;background:none;border:0;text-align:left;padding:11px 9px}.menu-option:hover{background:var(--navy);color:#fff}.window{position:absolute;width:470px;max-width:calc(100% - 18px);min-width:270px;background:var(--face);border:3px solid;border-color:#fff #333 #333 #fff;box-shadow:1px 1px #000,4px 4px 0 #0005;padding:3px;display:none;flex-direction:column;max-height:calc(100dvh - var(--task) - 20px);overflow:hidden;z-index:5}.window.open{display:flex}.titlebar{display:flex;align-items:center;gap:7px;min-height:29px;background:linear-gradient(90deg,var(--navy),#1085b8);padding:3px 4px;color:#fff;font-weight:bold;touch-action:none;cursor:move}.titlebar.inactive{background:linear-gradient(90deg,#777,#aaa)}.titlebar .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.window-actions{display:flex;gap:3px}.x-btn{width:25px;height:23px;padding:0;border:2px solid;border-color:#fff #444 #444 #fff;background:var(--face);font-weight:bold}.window-body{padding:12px;background:var(--face);overflow:auto;overscroll-behavior:contain;min-height:120px;user-select:text}.statusbar{border:1px inset #fff;padding:4px 6px;margin:4px 2px 1px;color:#444;font-size:11px}.win-heading{font-size:18px;font-weight:900;margin:0 0 8px}.panel{background:white;border:2px inset #eee;padding:12px;margin:9px 0}.panel.gray{background:#dedede}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.column{display:flex;flex-direction:column;gap:8px}.sep{height:1px;background:#888;border-bottom:1px solid #fff;margin:12px 0}.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.folder{border:1px dotted #777;background:#fff;padding:10px 5px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}.folder span{font-size:28px}.folder:hover{background:#d5e5ff}.folder small{color:#555}.address{background:white;border:2px inset #aaa;padding:7px;margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note{background:#fffdf1;border:1px solid #c4b36d;padding:12px;line-height:1.8}.item-orange{display:flex;align-items:center;gap:12px;border:2px dashed #e6b04c;background:#fff6dc;padding:11px;margin:10px 0}.item-orange .fruit{font-size:36px}.item-orange small{display:block;color:#805520;margin-top:4px}.item-orange.collected{filter:grayscale(1);opacity:.7}.item-orange button{margin-left:auto}.wish-input{width:100%;min-height:96px;resize:vertical;border:2px inset #eee;background:white;padding:9px;user-select:text}.wish-input:disabled{background:#ddd;color:#777}.progress-bar{border:2px inset #fff;background:#fff;height:26px;padding:2px;margin:10px 0}.progress-fill{height:100%;background:repeating-linear-gradient(90deg,#00843d 0 19px,#ffffff 19px 22px);transition:width .25s}.fake-browser{border:2px inset #eee;background:white;padding:12px}.browser-links button{display:block;border:0;background:none;color:#0000b8;text-decoration:underline;text-align:left;padding:7px 0}.browser-links button:hover{color:#d03b00}.popup-shade{position:absolute;inset:0;background:#0006;z-index:2000;display:none;align-items:center;justify-content:center;padding:15px}.popup-shade.show{display:flex}.popup{width:370px;max-width:100%;background:var(--face);padding:4px;border:3px solid;border-color:white #444 #444 white;box-shadow:5px 5px #0006}.popup-content{display:flex;gap:13px;align-items:center;line-height:1.7;padding:18px 13px}.popup-emoji{font-size:38px}.popup-footer{display:flex;justify-content:center;padding:2px 0 11px}.tiny-muted{color:#555;font-size:11px}.secret-locked{font-size:23px;font-weight:bold;text-align:center;padding:18px}.footer-links{margin-top:12px}.ghost-orange{position:absolute;top:51%;right:17%;font-size:34px;cursor:pointer;z-index:2;opacity:.3;transition:opacity .15s}.ghost-orange:hover{opacity:1}.credits{font-size:11px;color:#555;line-height:1.6}input[type=checkbox]{accent-color:#087e7e}input[type=radio]{accent-color:#087e7e}
@media(max-width:620px){.desktop-icons{grid-template-rows:repeat(5,79px);grid-auto-columns:77px;gap:5px 2px;left:6px;top:8px}.icon{width:75px;height:77px;font-size:11px}.icon .art{font-size:30px;line-height:34px}.sticker{top:30px;right:9px;max-width:54vw;opacity:.77}.sticker .hint{font-size:10px}.window{left:9px!important;top:55px!important;width:calc(100% - 18px)!important;max-height:calc(100dvh - 115px);box-shadow:2px 2px #0006}.window-body{padding:9px}.tray{gap:5px;padding:5px}.task-btn{min-width:68px;max-width:90px;font-size:11px}.start-btn{padding:3px 6px}.ghost-orange{right:12%;top:67%}.folders{gap:6px}.folder{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="desktop" id="desktop" data-wallpaper="teal">
  <div class="desktop-icons" id="icons">
    <button class="icon" data-open="computer"><span class="art">🖥️</span><span>내 컴퓨터</span></button>
    <button class="icon" data-open="explorer"><span class="art">📁</span><span>귤 탐색기</span></button>
    <button class="icon" data-open="browser"><span class="art">🌐</span><span>귤 인터넷</span></button>
    <button class="icon" data-open="notepad"><span class="art">📝</span><span>소원 메모장</span></button>
    <button class="icon" data-open="recycle"><span class="art">🗑️</span><span>귤 휴지통</span></button>
    <button class="icon" data-open="paint"><span class="art">🎨</span><span>귤 그림판</span></button>
    <button class="icon" data-open="control"><span class="art">⚙️</span><span>제어판</span></button>
    <button class="icon" data-open="collection"><span class="art">🍊</span><span>귤 수집 현황</span></button>
    <button class="icon" data-open="secret"><span class="art">🔒</span><span>SECRET.exe</span></button>
  </div>
  <div class="sticker" aria-hidden="true"><div class="small">© 1998 WISH SYSTEM</div><div class="big">GYUL<br>dows 98</div><div class="fruit">🍊 ✦ 🍊</div><div class="hint">설탕 코팅된 귤 일곱 알.<br>소원 한 개와 교환합니다.</div></div>
  <button class="ghost-orange" id="desktopOrange" title="뭔가 반짝인다" aria-label="바탕화면의 수상한 귤">🍊</button>
  <div class="start-menu" id="startMenu"><div class="start-side">GYULdows 98</div><div class="start-items"><button class="menu-option" data-open="computer">🖥️ 내 컴퓨터</button><button class="menu-option" data-open="collection">🍊 수집 현황</button><button class="menu-option" data-open="notepad">📝 소원 메모장</button><button class="menu-option" data-open="control">⚙️ 제어판</button><hr><button class="menu-option" id="helpBtn">❔ 도움말</button><button class="menu-option" id="shutdown">⏻ 시스템 종료</button></div></div>
  <div class="taskbar"><button class="start-btn" id="startBtn" aria-expanded="false">🍊 시작</button><div class="task-tabs" id="taskTabs"></div><div class="tray"><span class="orange-count" id="taskCount">🍊 0/7</span><span id="clock">00:00</span></div></div>
  <div class="popup-shade" id="popupShade" role="presentation"><div class="popup" role="alertdialog" aria-modal="true" aria-labelledby="popupTitle"><div class="titlebar"><span id="popupTitle" class="title">시스템 알림</span><div class="window-actions"><button class="x-btn" id="popupX" aria-label="닫기">×</button></div></div><div class="popup-content"><span class="popup-emoji" id="popupEmoji">🍊</span><div id="popupText"></div></div><div class="popup-footer"><button class="win-btn" id="popupOk" style="min-width:90px">확인</button></div></div></div>
</div>
<script>
(() => {
'use strict';
const desktop=document.getElementById('desktop');
const tabs=document.getElementById('taskTabs');
const $=id=>document.getElementById(id);
const KEY='gyuldows98_v1';
const DEFAULT={found:[],wallpaper:'teal',sound:true,wishes:0};
let state;
try{state={...DEFAULT,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...DEFAULT}}
if(!Array.isArray(state.found))state.found=[];
state.found=state.found.filter(v=>Number.isInteger(v)&&v>=1&&v<=7);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
let z=10;
let audio;
function sound(freq=660){if(!state.sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();const osc=audio.createOscillator(),gain=audio.createGain();osc.type='square';osc.frequency.value=freq;gain.gain.setValueAtTime(.04,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.13)}catch{}}
const fruits=[null,'바탕화면의 수상한 귤','귤 탐색기 깊은 폴더','귤 인터넷 광고','휴지통 속 멀쩡한 귤','그림판 아래의 귤','내 컴퓨터의 숨겨진 저장소','제어판의 진단용 귤'];
let popupAfter=null;
function alertBox(message,title='시스템 알림',emoji='🍊',after=null){$('popupText').textContent=message;$('popupTitle').textContent=title;$('popupEmoji').textContent=emoji;popupAfter=after;$('popupShade').classList.add('show');$('popupOk').focus()}
function closePopup(){$('popupShade').classList.remove('show');const callback=popupAfter;popupAfter=null;if(callback)callback()}
$('popupOk').onclick=closePopup;$('popupX').onclick=closePopup;
function collect(n){if(state.found.includes(n)){alertBox('이 귤은 이미 주머니에 있습니다. 중복 수집은 안 됩니다.','중복 획득','🧺');return}state.found.push(n);state.found.sort((a,b)=>a-b);save();sound(880);update();alertBox(`설탕 코팅된 귤 ${n}번을 획득했습니다! (${state.found.length}/7)`,'아이템 획득!','🍊',state.found.length===7?()=>{sound(1100);alertBox('일곱 개가 모두 모였습니다! 소원 메모장에서 소원을 실행할 수 있습니다.','수집 완료','✨');openWindow('notepad')}:null)}
function fruit(n,label='🍊 수상한 귤을 줍는다'){return `<div class="item-orange ${state.found.includes(n)?'collected':''}"><span class="fruit">🍊</span><div><b>설탕 코팅된 귤 #${n}</b><small>${state.found.includes(n)?'이미 획득한 귤입니다':fruits[n]}</small></div><button class="win-btn" data-collect="${n}">${state.found.includes(n)?'확인':'줍기'}</button></div>`}
const windows={};
function windowMarkup(id,title,icon){const el=document.createElement('section');el.className='window';el.id='win-'+id;el.setAttribute('role','dialog');el.setAttribute('aria-label',title);el.style.left=(105+(Object.keys(windows).length%5)*24)+'px';el.style.top=(65+(Object.keys(windows).length%5)*22)+'px';el.innerHTML=`<div class="titlebar"><span>${icon}</span><span class="title">${title}</span><div class="window-actions"><button class="x-btn" data-close="${id}" aria-label="${title} 닫기">×</button></div></div><div class="window-body"></div><div class="statusbar">GYULdows 98 · 준비 완료</div>`;desktop.appendChild(el);windows[id]={el,title,icon};enableDrag(el);return el}
const definitions={computer:['내 컴퓨터','🖥️'],explorer:['귤 탐색기','📁'],browser:['귤 인터넷','🌐'],notepad:['소원 메모장','📝'],recycle:['귤 휴지통','🗑️'],paint:['귤 그림판','🎨'],control:['제어판','⚙️'],collection:['귤 수집 현황','🍊'],secret:['SECRET.exe','🔒']};
Object.entries(definitions).forEach(([id,[title,icon]])=>windowMarkup(id,title,icon));
let folder='root',webPage='home';
function render(id){const body=windows[id].el.querySelector('.window-body');let html='';
switch(id){
case 'computer':html=`<h2 class="win-heading">🖥️ 내 컴퓨터</h2><div class="panel gray"><b>운영체제:</b> GYULdows 98<br><b>프로세서:</b> 설탕 486DX<br><b>현재 소원 처리량:</b> 0.00%<br><b>설치된 귤:</b> ${state.found.length}개</div><div class="folders"><button class="folder" data-open="explorer"><span>💾</span>로컬 디스크 (C:)</button><button class="folder" data-open="collection"><span>🍊</span>귤 저장소</button></div><div class="sep"></div><p>장치 관리자가 정체불명의 귤 드라이브를 발견했습니다.</p>${fruit(6)}`;break;
case 'explorer':{
let location={root:'C:\\',wish:'C:\\WISH',sugar:'C:\\SUGAR',hidden:'C:\\SYSTEM\\HIDDEN'}[folder];html=`<h2 class="win-heading">📁 귤 탐색기</h2><div class="address">주소(D): ${location}</div>`;
if(folder==='root')html+=`<div class="folders"><button class="folder" data-folder="wish"><span>📁</span>WISH</button><button class="folder" data-folder="sugar"><span>📁</span>SUGAR</button><button class="folder" data-folder="hidden"><span>🔐</span>HIDDEN</button></div><p class="tiny-muted">폴더를 눌러 파일을 살펴보세요.</p>`;
if(folder==='wish')html+=`<button class="win-btn" data-folder="root">← 뒤로</button><div class="note">README.TXT<br>소원을 빌려면 귤을 일곱 개 모으세요.<br>냉장 보관은 권장하지 않습니다.</div><button class="win-btn" data-open="notepad">소원 메모장 열기</button>`;
if(folder==='sugar')html+=`<button class="win-btn" data-folder="root">← 뒤로</button><div class="panel">sugar_recipe.txt<br>설탕 100g, 물 50ml, 기적 한 스푼.</div>`;
if(folder==='hidden')html+=`<button class="win-btn" data-folder="root">← 뒤로</button><div class="note">⚠️ 관리자 권한이 필요합니다.<br>하지만 관리자는 귤을 먹으러 갔습니다.</div>${fruit(2)}`;
break}
case 'browser':{
html=`<h2 class="win-heading">🌐 GYUL Explorer 5.0</h2><div class="address">주소: http://www.gyul.wish/${webPage}</div><div class="fake-browser">`;
if(webPage==='home')html+=`<h3>🍊 귤 인터넷 포털</h3><p>환영합니다! 전 세계 7개의 귤을 검색합니다.</p><div class="browser-links"><button data-web="shop">🍊 설탕귤 쇼핑몰 [광고]</button><button data-web="news">📰 오늘의 귤 뉴스</button><button data-web="forum">💬 귤 게시판</button></div>`;
if(webPage==='shop')html+=`<button class="win-btn" data-web="home">← 홈</button><h3>★ 긴급 귤 특가 ★</h3><p>단 0원! 택배비는 소원 하나!</p>${fruit(3)}`;
if(webPage==='news')html+=`<button class="win-btn" data-web="home">← 홈</button><h3>속보: 설탕 코팅된 귤 품귀</h3><p>전문가들은 실종된 귤을 찾는 누군가가 있다고 설명했습니다.</p>`;
if(webPage==='forum')html+=`<button class="win-btn" data-web="home">← 홈</button><h3>익명 귤 게시판</h3><p>ㅇㅇ: 귤 7개 모으면 진짜 소원 들어줌?</p><p>귤관리자: 이용약관을 확인해 주세요.</p>`;
html+='</div>';break}
case 'notepad':html=`<h2 class="win-heading">📝 소원.txt</h2><div class="note">설탕 코팅된 귤 일곱 개를 제출하면<br>소원 한 개를 실행할 수 있습니다.<br><br>현재 확보: <b>${state.found.length}/7</b></div><div class="sep"></div><label for="wishText"><b>소원 내용을 작성하세요.</b></label><textarea class="wish-input" id="wishText" placeholder="여기에 소원을 적으세요..." ${state.found.length!==7?'disabled':''}></textarea><div class="row" style="margin-top:10px"><button class="win-btn" id="runWish" ${state.found.length!==7?'disabled':''}>✨ 소원 실행.exe</button><span class="tiny-muted">${state.found.length===7?'실행 권한이 승인되었습니다.':'귤 7개를 모두 모으면 활성화됩니다.'}</span></div>`;break;
case 'recycle':html=`<h2 class="win-heading">🗑️ 귤 휴지통</h2><p>휴지통에 있는 파일:</p><div class="panel">🍊 귤껍질.tmp<br>🍊 귤껍질(1).tmp<br>📄 어제의 소원.doc</div><p>이상하게도 아직 멀쩡한 귤 하나가 보입니다.</p>${fruit(4)}`;break;
case 'paint':html=`<h2 class="win-heading">🎨 귤 그림판</h2><div style="background:white;border:3px inset #ddd;height:185px;display:grid;place-items:center;position:relative"><div style="font-size:95px">🍊</div><span style="position:absolute;bottom:6px;right:8px;font-size:11px">무제 - 그림판</span></div><p>작품명: 귤의 초상 (1998)</p>${fruit(5)}`;break;
case 'control':html=`<h2 class="win-heading">⚙️ 제어판</h2><div class="panel"><b>바탕화면 설정</b><div class="row" style="margin-top:9px"><button class="win-btn" data-theme="teal">청록</button><button class="win-btn" data-theme="blue">파랑</button><button class="win-btn" data-theme="pink">분홍</button><button class="win-btn" data-theme="night">야간</button></div></div><div class="panel"><label><input type="checkbox" id="soundToggle" ${state.sound?'checked':''}> 효과음 켜기</label></div><p>시스템 진단 도중 귤이 발견되었습니다.</p>${fruit(7)}<div class="sep"></div><button class="win-btn" id="resetBtn">🧹 수집 기록 초기화</button><p class="tiny-muted">초기화하면 모은 귤과 소원 실행 횟수가 삭제됩니다.</p>`;break;
case 'collection':html=`<h2 class="win-heading">🍊 귤 수집 현황</h2><b>${state.found.length} / 7 수집 완료</b><div class="progress-bar"><div class="progress-fill" style="width:${state.found.length/7*100}%"></div></div><div class="panel">${Array.from({length:7},(_,i)=>`<div style="padding:6px;border-bottom:1px dotted #ddd">${state.found.includes(i+1)?'🍊':'❔'} 귤 #${i+1} · ${state.found.includes(i+1)?fruits[i+1]:'미발견'}</div>`).join('')}</div><p>🔎 단서: 바탕화면, 탐색기, 인터넷, 휴지통, 그림판, 내 컴퓨터, 제어판.</p><button class="win-btn" data-open="notepad">📝 소원 메모장으로 이동</button>`;break;
case 'secret':html=state.found.length===7?`<div class="secret-locked">🍊 ACCESS GRANTED 🍊</div><div class="note" style="text-align:center">축하합니다.<br>당신은 일곱 개의 귤을 찾아냈습니다.<br><br>그런데 잠깐.<br><b>소원을 들어주는 건 대체 누구일까요?</b></div><button class="win-btn" data-open="notepad">소원을 실행한다</button>`:`<div class="secret-locked">🔒 ACCESS DENIED</div><div class="note">접근이 거부되었습니다.<br>필요한 귤: 7개<br>현재 보유: ${state.found.length}개</div>`;break;
}
body.innerHTML=html;
if(id==='notepad'){$('runWish')?.addEventListener('click',runWish)}
if(id==='control'){$('soundToggle')?.addEventListener('change',e=>{state.sound=e.target.checked;save()});$('resetBtn')?.addEventListener('click',()=>{if(confirm('정말 수집 기록을 초기화할까요?')){state.found=[];state.wishes=0;save();update();alertBox('귤 저장소가 비워졌습니다. 다시 모을 수 있습니다.','초기화 완료','🧹')}})}
}
function runWish(){if(state.found.length!==7)return;const wish=$('wishText')?.value.trim()||'';if(!wish){alertBox('소원을 입력해 주세요. 귤신은 독심술을 지원하지 않습니다.','입력 오류','⚠️');return}state.wishes++;save();sound(1000);const endings=['소원 접수 완료. 귤신이 검토 중입니다. 예상 처리 시간: 귤이 익을 때까지.','오류 777: 소원이 지나치게 인간적입니다. 그래도 귤신은 감동했습니다.','소원이 승인되었습니다! 단, 실행 담당자가 귤을 먹고 퇴근했습니다.','축하합니다. 당신의 소원은 우주 어딘가에 안전하게 저장되었습니다.'];const msg=endings[Math.floor(Math.random()*endings.length)];alertBox(`요청하신 소원: “${wish}”\n\n${msg}`,'소원 실행 결과','🌟')}
function openWindow(id){const w=windows[id];if(!w)return;w.el.classList.add('open');render(id);bringFront(id);refreshTabs();closeStart()}
function closeWindow(id){windows[id].el.classList.remove('open');refreshTabs()}
function bringFront(id){z++;Object.entries(windows).forEach(([key,w])=>w.el.querySelector('.titlebar').classList.toggle('inactive',key!==id));windows[id].el.style.zIndex=z;refreshTabs()}
function refreshTabs(){tabs.innerHTML=Object.entries(windows).filter(([id,w])=>w.el.classList.contains('open')).map(([id,w])=>`<button class="task-btn ${Number(w.el.style.zIndex)===z?'active':''}" data-task="${id}">${w.icon} ${w.title}</button>`).join('')}
function update(){desktop.dataset.wallpaper=state.wallpaper;$('taskCount').textContent=`🍊 ${state.found.length}/7`;$('desktopOrange').style.display=state.found.includes(1)?'none':'block';Object.keys(windows).forEach(id=>{if(windows[id].el.classList.contains('open')){if(id==='notepad'){const old=$('wishText')?.value;render(id);if(old&&$('wishText'))$('wishText').value=old}else render(id)}})}
function enableDrag(el){const bar=el.querySelector('.titlebar');let dragging=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||matchMedia('(max-width:620px)').matches)return;const r=el.getBoundingClientRect();dragging={pointer:e.pointerId,x:e.clientX-r.left,y:e.clientY-r.top};bar.setPointerCapture(e.pointerId);const id=el.id.slice(4);bringFront(id)});bar.addEventListener('pointermove',e=>{if(!dragging||dragging.pointer!==e.pointerId)return;const x=Math.max(0,Math.min(window.innerWidth-100,e.clientX-dragging.x));const y=Math.max(0,Math.min(window.innerHeight-100,e.clientY-dragging.y));el.style.left=x+'px';el.style.top=y+'px'});const stop=()=>{dragging=null};bar.addEventListener('pointerup',stop);bar.addEventListener('pointercancel',stop);el.addEventListener('pointerdown',()=>{bringFront(el.id.slice(4))})}
function closeStart(){$('startMenu').classList.remove('show');$('startBtn').setAttribute('aria-expanded','false')}
$('startBtn').addEventListener('click',()=>{const show=$('startMenu').classList.toggle('show');$('startBtn').setAttribute('aria-expanded',String(show));sound(440)});
desktop.addEventListener('click',e=>{const collectBtn=e.target.closest('[data-collect]');if(collectBtn){collect(Number(collectBtn.dataset.collect));return}const open=e.target.closest('[data-open]');if(open){openWindow(open.dataset.open);sound(550);return}const close=e.target.closest('[data-close]');if(close){closeWindow(close.dataset.close);return}const folderBtn=e.target.closest('[data-folder]');if(folderBtn){folder=folderBtn.dataset.folder;render('explorer');sound(510);return}const link=e.target.closest('[data-web]');if(link){webPage=link.dataset.web;render('browser');sound(480);return}const theme=e.target.closest('[data-theme]');if(theme){state.wallpaper=theme.dataset.theme;save();update();sound(590);return}const task=e.target.closest('[data-task]');if(task){bringFront(task.dataset.task);return}if(!e.target.closest('#startMenu')&&!e.target.closest('#startBtn'))closeStart()});
$('desktopOrange').onclick=()=>collect(1);
$('helpBtn').onclick=()=>{closeStart();alertBox('아이콘을 열어서 설탕 코팅된 귤 7개를 찾으세요. 모두 모으면 소원 메모장의 실행 버튼이 열립니다. 수집 기록은 이 브라우저에 저장됩니다.','사용 설명서','💡')};
$('shutdown').onclick=()=>{closeStart();alertBox('시스템을 종료하려 했지만 귤이 전원 버튼을 먹었습니다.','종료 실패','🔌')};
function setClock(){$('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}setClock();setInterval(setClock,30000);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('popupShade').classList.contains('show'))closePopup();else closeStart()}});
update();setTimeout(()=>{if(!sessionStorage.getItem('gyuldows_seen')){sessionStorage.setItem('gyuldows_seen','1');alertBox('GYULdows 98에 오신 것을 환영합니다!\n설탕 코팅된 귤 7개를 모으면 소원을 빌 수 있습니다.\n\n시작하려면 바탕화면 아이콘을 눌러 보세요.','환영합니다','🍊')}},350);
})();
</script>
</body>
</html>
